plugins { id 'com.android.application' }
android {
 namespace 'vn.giahung.citytour'
 compileSdk 35
 defaultConfig {
  applicationId 'vn.giahung.citytour'
  minSdk 26
  targetSdk 28
  versionCode 33
  versionName '3.3'
  def url = System.getenv('SITE_URL') ?: 'https://example.netlify.app/'
  resValue 'string', 'site_url', url
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
